<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <title>Agentdeck</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form">
      <div class="login-mark" aria-hidden="true">✳</div>
      <h1>Welcome to Agentdeck</h1>
      <p class="muted">Your coding conversations, in one place.</p>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="brand-row">
          <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>agentdeck</span></div>
          <button id="close-sidebar" class="icon close-sidebar" type="button" aria-label="Close conversations">×</button>
        </div>
        <label class="sidebar-label" for="project">WORKSPACE</label>
        <select id="project" title="Project folder"></select>
        <button id="new-chat" class="primary new-chat"><span aria-hidden="true">＋</span> New conversation</button>
      </div>
      <div class="sidebar-section-title">CONVERSATIONS</div>
      <div id="tag-filter" class="tag-filter hidden"></div>
      <ul id="sessions" class="sessions"></ul>
      <div class="sidebar-foot" id="host"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="toggle-sidebar" class="icon menu-button" type="button" aria-label="Open conversations" aria-expanded="false" title="Conversations"><span></span><span></span><span></span></button>
        <div class="title">
          <div class="topbar-eyebrow">WORKSPACE CHAT</div>
          <div id="title">New conversation</div>
          <div id="subtitle" class="muted"></div>
        </div>
        <span id="status" class="status"></span>
        <button id="toggle-usage" class="usage-button" type="button" title="Usage">Usage <span aria-hidden="true">↗</span></button>
      </header>

      <div id="usage" class="usage hidden"></div>

      <div id="messages" class="messages"></div>

      <div id="pending" class="pending"></div>

      <form id="composer" class="composer">
        <div id="attachments" class="attachments hidden"></div>
        <label class="sr-only" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Ask anything about your project..."></textarea>
        <div class="composer-row">
          <div class="composer-options">
            <select id="agent" title="Agent (for a new conversation)" aria-label="Agent" class="hidden"></select>
            <select id="mode" title="Mode" aria-label="Mode"></select>
            <select id="model" title="Model" aria-label="Model"></select>
            <select id="effort" title="Effort" aria-label="Effort"></select>
          </div>
          <div class="composer-actions">
            <button type="button" id="attach" title="Attach images (or paste / drop them)" aria-label="Attach images">＋</button>
            <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
            <button type="button" id="stop" class="danger hidden">Stop</button>
            <button type="submit" id="send" class="primary">Send <span aria-hidden="true">↗</span></button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <dialog id="tag-dialog" class="tag-dialog">
    <form method="dialog" id="tag-form">
      <h2>Tags</h2>
      <div id="tag-current" class="tag-list"></div>
      <input id="tag-input" type="text" maxlength="30" placeholder="Type a tag and press Enter" autocomplete="off">
      <div class="muted tag-hint">Quick tags (click to add or remove; × forgets one)</div>
      <div id="tag-quick" class="tag-list"></div>
      <div class="tag-actions">
        <button type="button" id="tag-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/app.js"></script>
</body>
</html>
